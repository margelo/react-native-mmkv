name: Build iOS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - 'example/ios/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/apple/**'
      - 'packages/nitro-mmkv/cpp/**'
      - 'packages/react-native-mmkv/apple/**'
      - 'packages/nitro-mmkv/apple/**'
      - '**/Package.swift'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'example/ios/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/apple/**'
      - 'packages/nitro-mmkv/cpp/**'
      - 'packages/react-native-mmkv/apple/**'
      - 'packages/nitro-mmkv/apple/**'
      - '**/Package.swift'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    name: Build iOS Example App
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Resolve Swift packages
        working-directory: example
        run: bun spm

      - name: Build App
        working-directory: example/ios
        run: "set -o pipefail && xcodebuild \
          -derivedDataPath build \
          -project MmkvExample.xcodeproj \
          -scheme MmkvExample \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          build \
          CODE_SIGNING_ALLOWED=NO"
