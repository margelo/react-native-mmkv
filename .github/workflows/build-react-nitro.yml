name: Build React Nitro example

on:
  pull_request:
    paths:
      - '.github/workflows/build-react-nitro.yml'
      - 'example-react-nitro/**'
      - 'packages/nitro-mmkv/**'
      - 'packages/react-nitro-mmkv/**'
      - 'bun.lock'
  push:
    branches: [main]

jobs:
  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun ios --build-only
        working-directory: example-react-nitro
      - uses: futureware-tech/simulator-action@v5
        with:
          model: iPhone 18 Pro
          os: iOS
          os_version: '27.2'
          wait_for_boot: true
      - run: bun test:harness --platform ios --skip-build
        working-directory: example-react-nitro

  android:
    # React Nitro ships its host Hermes compiler for Apple Silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - run: bun install --frozen-lockfile
      - run: bun android --build-only --abi arm64-v8a
        working-directory: example-react-nitro
