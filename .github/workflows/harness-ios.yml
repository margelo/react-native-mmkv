name: Harness iOS

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: "iOS Simulator device model"
        required: false
        default: "iPhone 18 Pro"
        type: string
      ios_version:
        description: "iOS version"
        required: false
        default: "27.2"
        type: string
      xcode_version:
        description: "Xcode version"
        required: false
        default: "27.2"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harness-ios.yml"
      - "example/ios/**"
      - "**/nitrogen/generated/shared/**"
      - "**/nitrogen/generated/apple/**"
      - "packages/nitro-mmkv/cpp/**"
      - "packages/react-native-mmkv/apple/**"
      - "packages/nitro-mmkv/apple/**"
      - "**/Package.swift"
      - "**/*.podspec"
      - "**/react-native.config.js"
      - "**/nitro.json"
      - "example/__tests__/**"
      - "example/rn-harness.config.mjs"
  pull_request:
    paths:
      - ".github/workflows/harness-ios.yml"
      - "example/ios/**"
      - "**/nitrogen/generated/shared/**"
      - "**/nitrogen/generated/apple/**"
      - "packages/nitro-mmkv/cpp/**"
      - "packages/react-native-mmkv/apple/**"
      - "packages/nitro-mmkv/apple/**"
      - "**/Package.swift"
      - "**/*.podspec"
      - "**/react-native.config.js"
      - "**/nitro.json"
      - "example/__tests__/**"
      - "example/rn-harness.config.mjs"

env:
  # Device configuration - can be overridden by workflow_dispatch inputs
  DEVICE_MODEL: ${{ github.event.inputs.device_model || 'iPhone 18 Pro' }}
  IOS_VERSION: ${{ github.event.inputs.ios_version || '27.2' }}
  DEVELOPER_DIR: /Applications/Xcode_${{ github.event.inputs.xcode_version || '27.2' }}.app/Contents/Developer

jobs:
  harness_ios_new:
    name: Harness iOS (new architecture)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Resolve Swift packages
        working-directory: example
        run: bun spm

      - name: Build iOS app
        working-directory: example/ios
        run: "set -o pipefail && xcodebuild \
          -derivedDataPath build \
          -project MmkvExample.xcodeproj \
          -scheme MmkvExample \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          build \
          CODE_SIGNING_ALLOWED=NO"

      - name: Setup iOS Simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: ${{ env.DEVICE_MODEL }}
          os: iOS
          os_version: ${{ env.IOS_VERSION }}
          wait_for_boot: true
          erase_before_boot: false

      - name: Install app
        run: |
          xcrun simctl install booted example/ios/build/Build/Products/Debug-iphonesimulator/MmkvExample.app

      - name: Run Harness E2E tests
        working-directory: example
        env:
          HARNESS_IOS_DEVICE: ${{ env.DEVICE_MODEL }}
          HARNESS_IOS_VERSION: ${{ env.IOS_VERSION }}
        run: |
          bun run test:harness --harnessRunner ios
