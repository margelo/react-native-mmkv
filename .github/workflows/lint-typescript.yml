name: Lint TypeScript

permissions:
  checks: write
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lint-typescript.yml'
      - 'config'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.lockb'
      - '**/package.json'
  pull_request:
    paths:
      - '.github/workflows/lint-typescript.yml'
      - 'config'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.lockb'
      - '**/package.json'

jobs:
  tsc:
    name: Compile TypeScript (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: reviewdog/action-setup@v1

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Run TypeScript (tsc)
        run: |
          bun typecheck | reviewdog -name="tsc" -efm="%f(%l,%c): error TS%n: %m" -reporter="github-pr-review" -filter-mode="nofilter" -fail-on-error -tee
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint JS (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: reviewdog/action-setup@v1

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Check packages and examples
        run: bun lint-ci
