name: Run Nitrogen

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-nitrogen.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.lockb'
      - '**/nitro.json'
      - '**/package.json'
  pull_request:
    paths:
      - '.github/workflows/run-nitrogen.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.lockb'
      - '**/nitro.json'
      - '**/package.json'

jobs:
  lint:
    name: Run Nitrogen for react-native-mmkv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Generate bindings for all packages
        run: bun specs

      - name: Verify no files have changed after nitrogen
        run: git diff --exit-code HEAD -- . ':(exclude)bun.lock'
